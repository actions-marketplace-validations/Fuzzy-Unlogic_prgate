# PR Gate workflow template — copy this file to .github/workflows/pr-gate.yml in your repo.
#
# Tip: pin to a full commit SHA (Fuzzy-Unlogic/prgate@<sha>) for stronger
# supply-chain safety instead of the pre-release @v1.0.0-alpha tag.
name: PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write # post/update the PR Gate comment

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: Fuzzy-Unlogic/prgate@v1.0.0-alpha
        # Optional inputs (defaults shown):
        # with:
        #   config-path: guardrails.prgate.json
        #   approval-label: prgate-approved
        #   github-token: ${{ github.token }}
        #   version-check: 'true'   # warn (never fail) when a newer PR Gate release exists
