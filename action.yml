name: 'PR Gate'
description: >-
  Deterministically flag pull requests that touch project-declared "protected" files for mandatory human review.
author: ''
branding:
  icon: 'shield'
  color: 'yellow'

inputs:
  github-token:
    description: 'Token used to read the PR, post the comment, and verify labeler permissions.'
    required: false
    default: ${{ github.token }}
  config-path:
    description: 'Path to the guardrails config, relative to the repo root.'
    required: false
    default: 'guardrails.prgate.json'
  approval-label:
    description: 'Label that a write-access user applies to unblock a hard-blocked PR.'
    required: false
    default: 'prgate-approved'
  version-check:
    description: >-
      When "true" (default), emit a non-blocking warning if a newer PR Gate release is available.
      Never fails the run. Set "false" to disable. Consumers pinned to a floating tag (e.g. v1) are
      never nudged, since they already auto-update.
    required: false
    default: 'true'

outputs:
  blocked:
    description: '"true" when the PR is currently blocked, "false" otherwise.'

runs:
  using: 'node24'
  main: 'dist/index.js'
