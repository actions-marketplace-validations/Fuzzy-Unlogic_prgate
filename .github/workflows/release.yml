# Release: build the dist/ bundle and attach it to the release tags.
#
# dist/ is NOT committed on main (it is gitignored) to keep PR diffs reviewable.
# GitHub runs an action's `dist/index.js` directly, so it must exist on the ref a
# consumer references. This workflow builds it and force-points both the exact tag
# (e.g. v1.2.3) and the floating major tag (e.g. v1) at a commit that includes dist/.
#
# To release (stable):  git tag v1.2.3 && git push origin v1.2.3
#   Consumers then use:  uses: Fuzzy-Unlogic/prgate@v1
# To pre-release:        git tag v1.0.0-alpha && git push origin v1.0.0-alpha
#   Pre-releases build dist/ but do NOT move the floating major tag (v1);
#   consumers pin the exact tag:  uses: Fuzzy-Unlogic/prgate@v1.0.0-alpha
#
# Note: pushes made with the built-in GITHUB_TOKEN do not trigger further workflow
# runs, so re-pointing the triggering tag here does not cause an infinite loop.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'        # stable, e.g. v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-*'      # pre-release, e.g. v1.0.0-alpha

permissions:
  contents: write # push tags
  id-token: write # OIDC token for npm Trusted Publishing (tokenless publish + provenance)

jobs:
  build-and-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version v${PKG_VERSION}. Bump package.json and re-tag."
            exit 1
          fi

      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      - name: Commit dist/ and (re)point the release tag (+ major tag for stable)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"          # 1.2.3 or 1.0.0-alpha

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f dist                      # dist/ is gitignored, force-add it
          git commit -m "build: bundle dist/ for ${TAG}"

          git tag -f "${TAG}"
          git push origin -f "refs/tags/${TAG}"

          # Only stable releases move the floating major tag (e.g. v1). A pre-release
          # (SemVer identifier after a '-', like v1.0.0-alpha) must NOT move v1 —
          # consumers opt in by pinning the exact pre-release tag.
          case "${VER}" in
            *-*)
              echo "Pre-release ${TAG}: built dist/, left the major tag untouched."
              ;;
            *)
              MAJOR="v${VER%%.*}" # v1
              git tag -f "${MAJOR}"
              git push origin -f "refs/tags/${MAJOR}"
              echo "Released ${TAG} and re-pointed ${MAJOR} at a commit including dist/."
              ;;
          esac
